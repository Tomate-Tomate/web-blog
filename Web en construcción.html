<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página en Construcción</title>
  <style>
:root {
  --naranja: #F86940;
  --verde: #40A629;
  --amarillo: #FFF4D8;
  --amarillo-oscuro: #FEE7B1;
  --texto: #2a2a2a;
  --texto-suave: #666;
  --font-display: 'Fraunces', serif;
  --font-body: 'DM Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--amarillo); color: var(--texto); overflow-x: hidden; }
html, body {
  margin: 0;
  padding: 0;
  background: #FFF4D8;
  font-family: 'Segoe UI', sans-serif;
  color: #333;
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  text-align: center;
}

    h1 {
      font-size: 2.5rem;
      color: #ff6600;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 1rem;
    }

    .icono {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
    }
.contenedor-principal {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
}
  </style>
</head>
<body>

    <div class="tt-header-container">
      <header id="tt-header" title="Header" class="tt-header">
        <div class="tt-logo-menu-container">
          <div id="tt-logo-container" title="Logo" class="tt-logo-container">
            <a id="i02g1" title="Tómate Tomate"><img src="https://drive.google.com/thumbnail?id=19u00Nz1w-MgIUmQbGZnLZ_uyMq1hmgaj" alt="Tómate Tomate" id="ixz46" class="tt-logo"/><div id="tt-subtitle" title="Copi" class="tt-subtitle">ALIMÉNTATE CONSCIENTEMENTE
              </div></a>
          </div>
        </div>
      </header>
    </div>

<main class="contenedor-principal">
  <div class="icono">🚧</div>
  <h1>Estamos trabajando en ello</h1>
  <p>Esta página está en construcción. Muy pronto podrás disfrutar de todo el contenido que tenemos preparado para ti. ¡Gracias por tu paciencia!</p>
</main>


</body>
</html>
